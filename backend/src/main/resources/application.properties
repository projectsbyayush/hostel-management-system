server.port=${SERVER_PORT:8080}
spring.application.name=hostel-management

# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true\&useSSL=false\&allowPublicKeyRetrieval=true\&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway manages the schema (V1__schema.sql, V2__demo_data.sql)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Schema is controlled by Flyway - do not let Hibernate modify it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT (change the secret in production) ----
app.jwt.secret=${JWT_SECRET:hostel-project-demo-secret-please-change-me-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Admin account (created/refreshed at startup by AdminSeeder) ----
# Set these in backend/.env (git-ignored). Defaults keep the local demo working.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@hostel.local}
app.admin.password=${ADMIN_PASSWORD:admin123}

logging.level.org.springframework.security=INFO
logging.level.com.hostel=INFO
